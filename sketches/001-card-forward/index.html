<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bindarr — Deck</title>
<style>
  /* DECK — DARK, AND MISSING *IS* THE BUYLIST.
     Zach: "buylist and missing seem redundant would just like to export from
     missing because anything missing in a deck I'm building would be assumed
     I am buying."
     Right, and it matches his standing dislike of redundant surfaces. So the
     separate buylist panel is gone: the Missing tab carries the running total
     and the export. One list, one price, one action. */
  :root {
    --bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
    --ink:#f5f5f7; --ink-2:#98989d; --ink-3:#636366;
    --hair:rgba(255,255,255,.1);
    --accent:#0a84ff; --have:#30d158; --need:#ff9f0a; --tap:44px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-size:17px; line-height:1.45; padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }

  header {
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    padding:calc(10px + env(safe-area-inset-top)) 20px 10px; border-bottom:1px solid var(--hair);
  }
  .deckpick { display:flex; align-items:center; gap:8px; cursor:pointer; }
  h1 { font-size:26px; font-weight:700; letter-spacing:-.02em; }
  .sub { font-size:13px; color:var(--ink-2); margin-top:2px; }

  main { max-width:1200px; margin:0 auto; padding:16px 20px 24px; }

  .progress { background:var(--surface); border-radius:16px; padding:18px; margin-bottom:16px; }
  .ptop { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .big { font-size:32px; font-weight:700; letter-spacing:-.02em; }
  .big small { font-size:17px; font-weight:500; color:var(--ink-2); }
  .cost { text-align:right; }
  .cost .amt { font-size:22px; font-weight:700; color:var(--need); }
  .cost .lbl { font-size:12px; color:var(--ink-2); }
  .bar { height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden; display:flex; }
  .bar i { display:block; background:var(--have); transition:width .5s cubic-bezier(.2,.8,.3,1); }

  .seg { display:flex; background:var(--surface); border-radius:10px; padding:2px; margin-bottom:16px; }
  .seg button { flex:1; border:0; background:transparent; font:inherit; font-size:14px; font-weight:500;
                color:var(--ink-2); padding:10px; border-radius:8px; cursor:pointer; transition:.18s;
                min-height:40px; }
  .seg button[aria-selected="true"] { background:var(--surface-3); color:var(--ink); font-weight:600; }

  /* The Missing tab gets its own header bar with the total and the export,
     which is what replaced the separate buylist panel. */
  .missingbar {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border-radius:14px; padding:13px 15px; margin-bottom:12px;
  }
  .missingbar .n { font-size:14px; color:var(--ink-2); }
  .missingbar .n b { color:var(--ink); font-size:17px; font-weight:700; display:block; }
  .export { border:0; background:var(--accent); color:#fff; font:inherit; font-size:14px; font-weight:600;
            padding:0 16px; height:var(--tap); border-radius:11px; cursor:pointer; flex-shrink:0;
            display:flex; align-items:center; gap:7px; }

  .list { background:var(--surface); border-radius:16px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:11px 14px; min-height:var(--tap);
         border-bottom:1px solid var(--hair); transition:background .15s; }
  .row:last-child { border-bottom:0; }
  @media (hover:hover) { .row:hover { background:var(--surface-2); } }

  .thumb { width:34px; height:47px; border-radius:5px; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .rname { flex:1; min-width:0; }
  .rname b { display:block; font-size:15px; font-weight:600; letter-spacing:-.01em;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rname span { font-size:12px; color:var(--ink-2); }

  .state { font-size:13px; font-weight:600; padding:4px 10px; border-radius:8px; flex-shrink:0; }
  .state.have { color:var(--have); background:color-mix(in srgb,var(--have) 18%,transparent); }
  .price { font-size:15px; font-weight:600; color:var(--need); flex-shrink:0; }

  .empty { padding:44px 20px; text-align:center; color:var(--ink-2); font-size:15px; }
  .empty b { display:block; color:var(--ink); font-size:17px; margin-bottom:4px; }

  nav {
    position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:space-around;
    background:color-mix(in srgb,var(--bg) 80%,transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--hair); padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  nav a { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none;
          color:var(--ink-3); font-size:10px; font-weight:500; min-height:var(--tap); justify-content:center; }
  nav a.on { color:var(--accent); }

  @media (min-width:900px) {
    body { padding-bottom:0; padding-left:220px; }
    nav { top:0; bottom:0; right:auto; width:220px; flex-direction:column; justify-content:flex-start;
          gap:2px; padding:24px 12px; border-top:0; border-right:1px solid var(--hair); }
    nav a { flex:none; flex-direction:row; gap:12px; justify-content:flex-start; font-size:15px;
            padding:10px 12px; border-radius:10px; }
    nav a.on { background:color-mix(in srgb,var(--accent) 18%,transparent); }
    header, main { padding-left:32px; padding-right:32px; }
    .list { columns:2; column-gap:16px; background:transparent; }
    .list .row { background:var(--surface); border-radius:12px; margin-bottom:8px;
                 break-inside:avoid; border-bottom:0; }
  }

  .toast { position:fixed; left:50%; transform:translateX(-50%) translateY(90px);
           bottom:calc(84px + env(safe-area-inset-bottom)); background:var(--surface-3); color:var(--ink);
           padding:12px 20px; border-radius:14px; font-size:14px; font-weight:500; z-index:40;
           transition:transform .3s cubic-bezier(.2,.8,.3,1); box-shadow:0 8px 28px rgba(0,0,0,.6); }
  .toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="deckpick">
    <h1>Krenko, Mob Boss</h1>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".4"><path d="M6 9l6 6 6-6"/></svg>
  </div>
  <div class="sub">Commander · 100 cards · Bracket 3</div>
</header>

<main>
  <div class="progress">
    <div class="ptop">
      <div>
        <div class="big">87<small>% built</small></div>
        <div class="sub">87 of 100 cards owned</div>
      </div>
      <div class="cost">
        <div class="amt">$41.60</div>
        <div class="lbl">to finish</div>
      </div>
    </div>
    <div class="bar"><i style="width:87%"></i></div>
  </div>

  <div class="seg" role="tablist">
    <button role="tab" aria-selected="true"  data-f="all">All 100</button>
    <button role="tab" aria-selected="false" data-f="have">Owned 87</button>
    <button role="tab" aria-selected="false" data-f="need">Missing 13</button>
  </div>

  <div id="mbar"></div>
  <div class="list" id="list"></div>
</main>

<nav>
  <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>Home</a>
  <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="18" rx="1.5"/></svg>Collection</a>
  <a href="#" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Decks</a>
  <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>Settings</a>
</nav>

<div class="toast" id="toast"></div>

<script>
  const CARDS = [
    ['Sol Ring','Commander Masters',1,'have','#7a6a52',0],
    ['Krenko, Mob Boss','Jumpstart',1,'have','#9a4b30',0],
    ['Goblin Chieftain','Modern Masters',1,'need','#8c3b2e',3.40],
    ['Purphoros, God of the Forge','Theros',1,'need','#a8452c',8.90],
    ['Skullclamp','Darksteel',1,'have','#6b6b6b',0],
    ['Dockside Extortionist','Commander 2019',1,'need','#8a4433',24.00],
    ['Mountain','Kaldheim',34,'have','#7d4a3a',0],
    ['Impact Tremors','Dragons of Tarkir',1,'have','#9b4a33',0],
    ['Goblin Matron','Urza\u2019s Saga',1,'need','#7e3a2c',1.20],
    ['Coat of Arms','Tenth Edition',1,'need','#6d6455',4.10],
  ];

  const list = document.getElementById('list');
  const mbar = document.getElementById('mbar');

  function render(f='all') {
    const rows = CARDS.filter(c => f === 'all' || c[3] === f);

    // MISSING IS THE BUYLIST. Its total and export live here rather than in a
    // second panel showing the same rows again.
    if (f === 'need' && rows.length) {
      const total = rows.reduce((a,c) => a + c[5], 0);
      mbar.innerHTML = `<div class="missingbar">
        <div class="n"><b>$${total.toFixed(2)}</b>${rows.length} cards to buy</div>
        <button class="export" onclick="ping('Buylist copied — ${rows.length} cards')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
          Export
        </button></div>`;
    } else { mbar.innerHTML = ''; }

    list.innerHTML = rows.length ? rows.map(([n,s,q,st,tint,price]) => `
      <div class="row">
        <div class="thumb" style="background:linear-gradient(150deg,${tint},${tint}aa)"></div>
        <div class="rname"><b>${n}</b><span>${s}${q>1?' · '+q+'x':''}</span></div>
        ${st==='have' ? '<div class="state have">Owned</div>'
                      : `<div class="price">$${price.toFixed(2)}</div>`}
      </div>`).join('')
      : `<div class="empty"><b>Deck complete</b>You own every card in this list.</div>`;
  }
  render();

  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    render(b.dataset.f);
  });

  const toast = document.getElementById('toast'); let t;
  function ping(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(t); t = setTimeout(() => toast.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
