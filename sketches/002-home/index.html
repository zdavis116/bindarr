<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bindarr — Home</title>
<style>
  /* HOME / DASHBOARD — DARK.
     Zach kept the dashboard as the landing screen, so it has to earn that spot.
     A dashboard that only reports numbers is a poster; this one is built around
     the two things he does next -- carry on building a deck, or scan a stack --
     with the numbers as context rather than the point. */
  :root {
    --bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
    --ink:#f5f5f7; --ink-2:#98989d; --ink-3:#636366;
    --hair:rgba(255,255,255,.1);
    --accent:#0a84ff; --have:#30d158; --need:#ff9f0a; --tap:44px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-size:17px; line-height:1.45; padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }

  header {
    padding:calc(14px + env(safe-area-inset-top)) 20px 4px;
    max-width:1100px; margin:0 auto;
  }
  .greet { font-size:13px; color:var(--ink-2); font-weight:500; }
  h1 { font-size:34px; font-weight:700; letter-spacing:-.022em; margin-top:2px; }

  main { max-width:1100px; margin:0 auto; padding:14px 20px 24px; }

  /* PRIMARY ACTION FIRST. Scanning is the thing he does most and it is the
     only action with a physical stack waiting on it, so it gets the top slot
     and full width rather than a tab-bar icon alone. */
  .scan {
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:linear-gradient(135deg,var(--accent),#0060d0); color:#fff;
    border:0; border-radius:18px; padding:18px; cursor:pointer; font:inherit;
    min-height:76px; box-shadow:0 8px 24px rgba(10,132,255,.25);
    transition:transform .2s cubic-bezier(.2,.8,.3,1);
  }
  .scan:active { transform:scale(.98); }
  .scan .icon { width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.2);
                display:grid; place-items:center; flex-shrink:0; }
  .scan b { display:block; font-size:17px; font-weight:600; }
  .scan span { font-size:13px; opacity:.85; }

  .sectitle { font-size:13px; font-weight:600; color:var(--ink-2); text-transform:uppercase;
              letter-spacing:.05em; margin:24px 0 10px; }

  /* DECKS IN PROGRESS -- the real "continue where you left off". Each row
     answers the buying question at a glance, which is the point of the app. */
  .deck {
    display:flex; align-items:center; gap:13px; background:var(--surface); border-radius:14px;
    padding:13px 15px; margin-bottom:9px; cursor:pointer; min-height:var(--tap);
    transition:background .15s;
  }
  @media (hover:hover) { .deck:hover { background:var(--surface-2); } }
  .deck:active { background:var(--surface-2); }
  .ring { width:42px; height:42px; flex-shrink:0; position:relative; }
  .ring svg { transform:rotate(-90deg); }
  .ring .pct { position:absolute; inset:0; display:grid; place-items:center;
               font-size:11px; font-weight:700; }
  .dinfo { flex:1; min-width:0; }
  .dinfo b { display:block; font-size:15px; font-weight:600; letter-spacing:-.01em;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dinfo span { font-size:12px; color:var(--ink-2); }
  .dcost { font-size:14px; font-weight:600; color:var(--need); flex-shrink:0; }
  .dcost.done { color:var(--have); }

  /* Numbers last, and small. Context, not the headline. */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:6px; }
  .stat { background:var(--surface); border-radius:14px; padding:14px; text-align:center; }
  .stat b { display:block; font-size:22px; font-weight:700; letter-spacing:-.02em; }
  .stat span { font-size:11px; color:var(--ink-2); }

  nav {
    position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:space-around;
    background:color-mix(in srgb,var(--bg) 80%,transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--hair); padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  nav a { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none;
          color:var(--ink-3); font-size:10px; font-weight:500; min-height:var(--tap); justify-content:center; }
  nav a.on { color:var(--accent); }

  @media (min-width:900px) {
    body { padding-bottom:0; padding-left:220px; }
    nav { top:0; bottom:0; right:auto; width:220px; flex-direction:column; justify-content:flex-start;
          gap:2px; padding:24px 12px; border-top:0; border-right:1px solid var(--hair); }
    nav a { flex:none; flex-direction:row; gap:12px; justify-content:flex-start; font-size:15px;
            padding:10px 12px; border-radius:10px; }
    nav a.on { background:color-mix(in srgb,var(--accent) 18%,transparent); }
    header, main { padding-left:32px; padding-right:32px; }
    .cols { display:grid; grid-template-columns:1fr 320px; gap:22px; align-items:start; }
  }
</style>
</head>
<body>

<header>
  <div class="greet">Saturday</div>
  <h1>Bindarr</h1>
</header>

<main>
  <button class="scan">
    <span class="icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3.5"/></svg>
    </span>
    <span><b>Scan cards</b><span>Add to your collection</span></span>
  </button>

  <div class="cols">
    <div>
      <div class="sectitle">Decks in progress</div>

      <div class="deck">
        <div class="ring">
          <svg width="42" height="42"><circle cx="21" cy="21" r="17" stroke="#2c2c2e" stroke-width="4" fill="none"/>
          <circle cx="21" cy="21" r="17" stroke="#30d158" stroke-width="4" fill="none"
                  stroke-dasharray="107" stroke-dashoffset="14" stroke-linecap="round"/></svg>
          <div class="pct">87%</div>
        </div>
        <div class="dinfo"><b>Krenko, Mob Boss</b><span>13 cards missing</span></div>
        <div class="dcost">$41.60</div>
      </div>

      <div class="deck">
        <div class="ring">
          <svg width="42" height="42"><circle cx="21" cy="21" r="17" stroke="#2c2c2e" stroke-width="4" fill="none"/>
          <circle cx="21" cy="21" r="17" stroke="#30d158" stroke-width="4" fill="none"
                  stroke-dasharray="107" stroke-dashoffset="43" stroke-linecap="round"/></svg>
          <div class="pct">60%</div>
        </div>
        <div class="dinfo"><b>Atraxa Superfriends</b><span>40 cards missing</span></div>
        <div class="dcost">$186.20</div>
      </div>

      <div class="deck">
        <div class="ring">
          <svg width="42" height="42"><circle cx="21" cy="21" r="17" stroke="#2c2c2e" stroke-width="4" fill="none"/>
          <circle cx="21" cy="21" r="17" stroke="#30d158" stroke-width="4" fill="none"
                  stroke-dasharray="107" stroke-dashoffset="0" stroke-linecap="round"/></svg>
          <div class="pct">100%</div>
        </div>
        <div class="dinfo"><b>Muldrotha Value</b><span>Ready to play</span></div>
        <div class="dcost done">Complete</div>
      </div>
    </div>

    <div>
      <div class="sectitle">Collection</div>
      <div class="stats">
        <div class="stat"><b>154</b><span>Cards</span></div>
        <div class="stat"><b>38</b><span>Sets</span></div>
        <div class="stat"><b>$892</b><span>Value</span></div>
      </div>
    </div>
  </div>
</main>

<nav>
  <a href="#" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>Home</a>
  <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="18" rx="1.5"/></svg>Collection</a>
  <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Decks</a>
  <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>Settings</a>
</nav>

</body>
</html>
