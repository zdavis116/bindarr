<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bindarr — Decks</title>
<style>
  /* DECK LIST — the screen that was missing.
     Zach: "if you go into decks do you see a list of decks you can pick from.
     That view is missing. Also I do like the idea of generating a buy list from
     multiple decks at once so from like the deck list view."
     So this is both a picker AND the multi-deck buylist surface. Selection mode
     is entered deliberately (Select), because a list where every row is a
     checkbox makes the common case -- open a deck -- slower.

     The combined buylist buys ONE COPY PER DECK. See updateBar. */
  :root {
    --bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
    --ink:#f5f5f7; --ink-2:#98989d; --ink-3:#636366;
    --hair:rgba(255,255,255,.1);
    --accent:#0a84ff; --have:#30d158; --need:#ff9f0a; --tap:44px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-size:17px; line-height:1.45; padding-bottom:calc(150px + env(safe-area-inset-bottom));
  }

  header {
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    padding:calc(8px + env(safe-area-inset-top)) 20px 10px; border-bottom:1px solid transparent;
    transition:border-color .2s;
  }
  header.stuck { border-bottom-color:var(--hair); }
  .h1row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:34px; letter-spacing:-.022em; font-weight:700; }
  .txtbtn { border:0; background:transparent; color:var(--accent); font:inherit; font-size:16px;
            font-weight:500; cursor:pointer; min-height:var(--tap); padding:0 2px; }

  main { max-width:1100px; margin:0 auto; padding:14px 20px 24px; }

  .deck {
    display:flex; align-items:center; gap:13px; background:var(--surface); border-radius:14px;
    padding:13px 15px; margin-bottom:9px; cursor:pointer; min-height:var(--tap);
    transition:background .15s; border:1.5px solid transparent;
  }
  @media (hover:hover) { .deck:hover { background:var(--surface-2); } }
  .deck:active { background:var(--surface-2); }
  .deck.sel { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,var(--surface)); }

  /* The checkbox only exists in selection mode -- no dead controls sitting in
     the normal browsing path. */
  .check {
    width:24px; height:24px; border-radius:50%; border:2px solid var(--ink-3); flex-shrink:0;
    display:grid; place-items:center; transition:.15s;
  }
  .deck.sel .check { background:var(--accent); border-color:var(--accent); }
  .check svg { opacity:0; }
  .deck.sel .check svg { opacity:1; }

  .ring { width:42px; height:42px; flex-shrink:0; position:relative; }
  .ring svg.r { transform:rotate(-90deg); }
  .ring .pct { position:absolute; inset:0; display:grid; place-items:center; font-size:11px; font-weight:700; }
  .dinfo { flex:1; min-width:0; }
  .dinfo b { display:block; font-size:15px; font-weight:600; letter-spacing:-.01em;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dinfo span { font-size:12px; color:var(--ink-2); }
  .dcost { font-size:14px; font-weight:600; color:var(--need); flex-shrink:0; }
  .dcost.done { color:var(--have); }

  .newdeck {
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--surface); border:1.5px dashed var(--hair); color:var(--ink-2);
    border-radius:14px; padding:15px; font:inherit; font-size:15px; font-weight:500;
    cursor:pointer; min-height:var(--tap); margin-top:4px;
  }

  /* MULTI-DECK BUYLIST BAR. Appears only in selection mode, and it DEDUPES --
     two decks both wanting a Sol Ring is one purchase, not two. Saying so on
     the bar matters: a total that silently double-counts would send him to a
     shop with the wrong number. */
  .buybar {
    position:fixed; left:0; right:0; bottom:calc(60px + env(safe-area-inset-bottom));
    z-index:29; padding:0 16px; transform:translateY(140px);
    transition:transform .3s cubic-bezier(.2,.8,.3,1); pointer-events:none;
  }
  .buybar.show { transform:translateY(0); pointer-events:auto; }
  .buybar .inner {
    background:var(--surface-3); border-radius:16px; padding:14px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.7); max-width:1068px; margin:0 auto;
  }
  .bbtop { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:11px; }
  .bbtop b { font-size:20px; font-weight:700; color:var(--need); }
  .bbtop .lbl { font-size:13px; color:var(--ink-2); }
  .bbnote { font-size:11px; color:var(--ink-3); margin-top:-7px; margin-bottom:11px; }
  .export {
    width:100%; border:0; background:var(--accent); color:#fff; font:inherit; font-size:16px;
    font-weight:600; height:46px; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .export:disabled { background:var(--surface-2); color:var(--ink-3); cursor:not-allowed; }

  nav {
    position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:space-around;
    background:color-mix(in srgb,var(--bg) 80%,transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--hair); padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  nav a { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none;
          color:var(--ink-3); font-size:10px; font-weight:500; min-height:var(--tap); justify-content:center; }
  nav a.on { color:var(--accent); }

  @media (min-width:900px) {
    body { padding-bottom:0; padding-left:220px; }
    nav { top:0; bottom:0; right:auto; width:220px; flex-direction:column; justify-content:flex-start;
          gap:2px; padding:24px 12px; border-top:0; border-right:1px solid var(--hair); }
    nav a { flex:none; flex-direction:row; gap:12px; justify-content:flex-start; font-size:15px;
            padding:10px 12px; border-radius:10px; }
    nav a.on { background:color-mix(in srgb,var(--accent) 18%,transparent); }
    header, main { padding-left:32px; padding-right:32px; }
    .decks { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:10px; }
    .deck { margin-bottom:0; }
    .buybar { left:220px; bottom:20px; }
  }

  .toast { position:fixed; left:50%; transform:translateX(-50%) translateY(120px);
           bottom:calc(150px + env(safe-area-inset-bottom)); background:var(--surface-3); color:var(--ink);
           padding:12px 20px; border-radius:14px; font-size:14px; font-weight:500; z-index:40;
           transition:transform .3s cubic-bezier(.2,.8,.3,1); box-shadow:0 8px 28px rgba(0,0,0,.6); }
  .toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header id="hd">
  <div class="h1row">
    <h1>Decks</h1>
    <button class="txtbtn" id="selbtn">Select</button>
  </div>
</header>

<main>
  <div class="decks" id="decks"></div>
  <button class="newdeck">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    New deck
  </button>
</main>

<div class="buybar" id="buybar">
  <div class="inner">
    <div class="bbtop">
      <span class="lbl" id="bblbl">2 decks selected</span>
      <b id="bbtotal">$0.00</b>
    </div>
    <div class="bbnote" id="bbnote">One copy per deck</div>
    <button class="export" id="exportbtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
      Export combined buylist
    </button>
  </div>
</div>

<nav>
  <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>Home</a>
  <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="18" rx="1.5"/></svg>Collection</a>
  <a href="#" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Decks</a>
  <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>Settings</a>
</nav>

<div class="toast" id="toast"></div>

<script>
  /* name, commander/format, owned, total, missing cards as [card, price] */
  const DECKS = [
    ['Krenko, Mob Boss','Commander · Bracket 3',87,100,
      [['Goblin Chieftain',3.40],['Dockside Extortionist',24.00],['Coat of Arms',4.10],['Sol Ring',1.90]]],
    ['Atraxa Superfriends','Commander · Bracket 4',60,100,
      [['Doubling Season',42.00],['The Chain Veil',12.50],['Sol Ring',1.90],['Teferi, Time Raveler',14.00]]],
    ['Muldrotha Value','Commander · Bracket 3',100,100, []],
    ['Mono-Red Burn','Modern',54,60,
      [['Goblin Guide',8.20],['Eidolon of the Great Revel',6.40]]],
  ];

  let selecting = false;
  const sel = new Set();

  const wrap = document.getElementById('decks');
  const buybar = document.getElementById('buybar');

  function render() {
    wrap.innerHTML = DECKS.map((d,i) => {
      const [name, fmt, owned, total, missing] = d;
      const pct = Math.round(owned / total * 100);
      const cost = missing.reduce((a,m) => a + m[1], 0);
      const dash = 107, off = dash - (dash * pct / 100);
      return `<div class="deck ${sel.has(i)?'sel':''}" onclick="tap(${i})">
        ${selecting ? `<div class="check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="M5 13l4 4L19 7"/></svg></div>` : `
        <div class="ring">
          <svg class="r" width="42" height="42">
            <circle cx="21" cy="21" r="17" stroke="#2c2c2e" stroke-width="4" fill="none"/>
            <circle cx="21" cy="21" r="17" stroke="${pct===100?'#30d158':'#30d158'}" stroke-width="4" fill="none"
                    stroke-dasharray="${dash}" stroke-dashoffset="${off}" stroke-linecap="round"/>
          </svg>
          <div class="pct">${pct}%</div>
        </div>`}
        <div class="dinfo"><b>${name}</b><span>${missing.length ? missing.length + ' cards missing' : 'Ready to play'}</span></div>
        <div class="dcost ${cost?'':'done'}">${cost ? '$'+cost.toFixed(2) : 'Complete'}</div>
      </div>`;
    }).join('');
  }
  render();

  function tap(i) {
    if (!selecting) { ping(DECKS[i][0]); return; }
    sel.has(i) ? sel.delete(i) : sel.add(i);
    render(); updateBar();
  }

  function updateBar() {
    const lbl = document.getElementById('bblbl');
    const tot = document.getElementById('bbtotal');
    const note = document.getElementById('bbnote');
    const btn = document.getElementById('exportbtn');

    // ONE COPY PER DECK -- NOT deduped. Zach: "if I select 3 decks and even one
    // needs a sol ring there should be 3 sol rings in that list not 1. I get
    // the thinking but I don't want to have to keep swapping cards between
    // decks would rather each deck be built ready to go."
    //
    // That is a product decision, not a display one, and my first version had
    // it backwards. Deduping optimises for money spent; he is optimising for
    // decks that are physically assembled and playable without cannibalising
    // each other. A shared-card buylist would leave him one Sol Ring short the
    // moment he wanted to play two of these decks in the same evening.
    const need = new Map();   // name -> { qty, price }
    [...sel].forEach(i => DECKS[i][4].forEach(([n, p]) => {
      const e = need.get(n) || { qty: 0, price: p };
      e.qty += 1;
      need.set(n, e);
    }));
    const copies = [...need.values()].reduce((a, e) => a + e.qty, 0);
    const total  = [...need.values()].reduce((a, e) => a + e.price * e.qty, 0);
    const dupes  = copies - need.size;

    lbl.textContent = sel.size + (sel.size === 1 ? ' deck selected' : ' decks selected');
    tot.textContent = '$' + total.toFixed(2);
    note.textContent = dupes > 0
      ? `${copies} cards — ${dupes} duplicate${dupes>1?'s':''} so every deck is built`
      : `${copies} card${copies===1?'':'s'}`;
    btn.disabled = copies === 0;
    buybar.classList.toggle('show', selecting && sel.size > 0);
  }

  document.getElementById('selbtn').onclick = function () {
    selecting = !selecting;
    this.textContent = selecting ? 'Done' : 'Select';
    if (!selecting) sel.clear();
    render(); updateBar();
  };

  document.getElementById('exportbtn').onclick = () => {
    const need = new Map();
    [...sel].forEach(i => DECKS[i][4].forEach(([n]) => need.set(n, (need.get(n) || 0) + 1)));
    const copies = [...need.values()].reduce((a, q) => a + q, 0);
    ping(`Buylist copied — ${copies} cards`);
  };

  const toast = document.getElementById('toast'); let t;
  function ping(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(t); t = setTimeout(() => toast.classList.remove('show'), 1900);
  }
  addEventListener('scroll', () => document.getElementById('hd').classList.toggle('stuck', scrollY > 4));
</script>
</body>
</html>
