<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bindarr — desktop Dashboard</title>
<style>
  :root{
    --bg:#0b0b0d; --s1:#151518; --s2:#1c1c21; --s3:#25252b;
    --line:#2e2e36; --t1:#f2f2f5; --t2:#b9b9c4; --t3:#7d7d8a;
    --accent:#0a84ff; --good:#4ade80; --warn:#fbbf24; --bad:#ff6b5e;
  }
  *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--s3) var(--bg)}
  /* SCROLLBARS, matching the app (index.css:307): 8px, track the page colour,
     thumb a shade up, inset by a 2px border so it reads as a slim pill. */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--s2);border-radius:6px;
                            border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--t3)}
  ::-webkit-scrollbar-corner{background:var(--bg)}

  body{margin:0;background:var(--bg);color:var(--t1);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

  .shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
  .rail{border-right:1px solid var(--line);padding:1rem .7rem;background:var(--s1)}
  .brand{font-weight:800;font-size:1.05rem;padding:.2rem .5rem 1rem}
  .brand i{color:var(--accent);font-style:normal}
  .nav{display:flex;align-items:center;gap:.6rem;padding:.55rem .6rem;border-radius:8px;
       color:var(--t2);font-size:.85rem;font-weight:600;cursor:pointer;margin-bottom:2px}
  .nav.on{background:var(--accent);color:#fff}
  .nav span{width:16px;text-align:center;opacity:.9}

  .main{padding:1.1rem 1.3rem}
  .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem}
  .head h1{font-size:1.15rem;margin:0}
  .head .sub{color:var(--t3);font-size:.76rem}

  .panel{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:.85rem}
  .panel h3{font-size:.82rem;margin:0 0 .6rem;color:var(--t1)}
  .lbl{font-size:.7rem;letter-spacing:.04em;color:var(--t3);text-transform:uppercase}
  .big{font-size:1.65rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .sub{color:var(--t3);font-size:.75rem}

  /* FOUR KPIs, then a 1.4fr / 1fr split. */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1rem}
  .cols{display:grid;grid-template-columns:1.45fr 1fr;gap:1rem;align-items:start}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}

  table{width:100%;border-collapse:collapse;font-size:.81rem}
  th{text-align:left;font-weight:600;color:var(--t3);font-size:.72rem;
     padding:.3rem .4rem;border-bottom:1px solid var(--line)}
  td{padding:.42rem .4rem;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .deckrow{cursor:pointer}
  .deckrow:hover{background:var(--s2)}
  .cmd{display:flex;align-items:center;gap:.5rem}
  .cmd img{width:26px;height:26px;border-radius:50%;object-fit:cover;
           object-position:50% 18%;flex:0 0 auto;background:var(--s3)}

  .pill{font-size:.7rem;font-weight:700;padding:.08rem .42rem;border-radius:999px;
        background:var(--s3);color:var(--t2)}
  .pill.g{background:rgba(74,222,128,.15);color:var(--good)}
  .pill.a{background:rgba(251,191,36,.15);color:var(--warn)}

  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
  .card{position:relative}
  .copies{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.78);
          color:#fff;font-size:.64rem;font-weight:800;padding:.05rem .3rem;
          border-radius:4px;line-height:1.4}
  .card{border-radius:7px;overflow:hidden;background:var(--s2);cursor:pointer;
        border:1px solid var(--line)}
  .card img{width:100%;display:block;aspect-ratio:.717;object-fit:cover}
  .card .cap{padding:.3rem .35rem;font-size:.7rem}
  .card .cap b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card:hover{border-color:var(--accent)}

  .rows div.r{display:flex;justify-content:space-between;gap:.5rem;
              padding:.34rem 0;border-bottom:1px solid var(--line);font-size:.79rem}
  .rows div.r:last-child{border-bottom:0}
  .rows .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:.35rem 0 .5rem}
  .bar i{display:block}

  /* PHONE. Zach: "I would like to maybe see top 10 most valuable on my
     dashboard on my phone as well." The rail becomes the existing bottom nav,
     the KPI grid halves, and the columns stack -- but the top-10 block stays,
     scrolling sideways so ten cards do not become a tall wall of images. */
  @media(max-width:760px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .rail{display:none}
    .main{padding:.8rem}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
    .big{font-size:1.3rem}
    .cols{grid-template-columns:minmax(0,1fr);gap:.8rem}
    /* Grid and flex children default to min-width:auto, so the
       sideways card strip would push the whole page wide instead
       of scrolling inside its panel. Measured: doc scrollWidth
       1194 on a 390px screen. */
    .cols > *, .panel{min-width:0}
    .cards{display:flex;overflow-x:auto;gap:.5rem;padding-bottom:.3rem;
           scroll-snap-type:x mandatory}
    .cards .card{flex:0 0 108px;scroll-snap-align:start}
    table{font-size:.78rem}
    /* The deck table loses its two money columns on a phone: name, built and
       missing are what you check on the move. */
    #decktable th:nth-child(4), #decktable td:nth-child(4),
    #decktable th:nth-child(5), #decktable td:nth-child(5){display:none}
  }

  .note{background:#17170c;border:1px solid #3d3a1f;border-radius:10px;
        padding:.55rem .7rem;font-size:.73rem;color:#e8dfae;margin-top:1rem}
  .note b{color:#ffe9a3}
</style></head>
<body>
<div class="shell">
  <div class="rail">
    <div class="brand">Bind<i>arr</i></div>
    <div class="nav on"><span>◱</span>Dashboard</div>
    <div class="nav"><span>▤</span>Collection</div>
    <div class="nav"><span>❖</span>Decks</div>
    <div class="nav"><span>⚙</span>Settings</div>
  </div>

  <div class="main">
    <div class="head">
      <h1>Dashboard</h1>
      <span class="sub" id="srcline"></span>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="cols">
      <div>
        <div class="panel" style="margin-bottom:1rem">
          <h3>Your decks</h3>
          <table id="decktable"></table>
        </div>
        <div class="panel">
          <h3>Most valuable <span class="sub" style="font-weight:400">top 10 · live prices</span></h3>
          <div class="cards" id="top"></div>
        </div>
      </div>

      <div>
        <div class="panel" style="margin-bottom:1rem">
          <h3>Recently added</h3>
          <div class="rows" id="recent"></div>
        </div>
        <div class="panel">
          <h3>Where your cards are from</h3>
          <div id="sets" class="rows"></div>
        </div>
      </div>
    </div>

    <div class="note" id="note"></div>
  </div>
</div>

<script src="./dash-data.js"></script>
<script>
const money = n => '$' + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const num   = n => Number(n||0).toLocaleString();

// FOUR NUMBERS THAT ANSWER "how am I doing".
//
// The change-over-time line from the original sketch is NOT here: the API
// reports change7d.available === false, so there is no price history yet.
// Showing "▲ $12.40 this week" would be inventing a measurement.
function kpis(){
  const s = D.summary;
  const toFinish = D.decks.reduce((t,d)=>t+(d.missingCost||0),0);
  const missing  = D.decks.reduce((t,d)=>t+((d.total||0)-(d.owned||0)),0);
  const incomplete = D.decks.filter(d=>d.owned<d.total).length;
  const roiGood = s.roiAbs >= 0;

  document.getElementById('kpis').innerHTML = `
    <div class="panel">
      <div class="lbl">Collection value</div>
      <div class="big">${money(s.value)}</div>
      <div class="sub">${s.change7d.available
        ? (s.change7d.abs>=0?'▲':'▼') + ' ' + money(Math.abs(s.change7d.abs)) + ' this week'
        : 'no price history yet'}</div>
    </div>
    <div class="panel">
      <div class="lbl">Cards</div>
      <div class="big">${num(s.cards)}</div>
      <div class="sub">${num(s.unique)} unique</div>
    </div>
    <div class="panel">
      <div class="lbl">Decks</div>
      <div class="big">${D.decks.length}</div>
      <div class="sub">${incomplete ? incomplete + ' incomplete' : 'all complete'}</div>
    </div>
    <div class="panel">
      <div class="lbl">To finish all decks</div>
      <div class="big" style="color:${toFinish?'var(--warn)':'var(--good)'}">${money(toFinish)}</div>
      <div class="sub">${missing ? missing + ' cards missing' : 'nothing missing'}</div>
    </div>`;

  document.getElementById('srcline').textContent =
    `prices from ${s.priceSource} · ${num(s.cards)} cards priced`;
}

function deckTable(){
  const rows = D.decks.slice().sort((a,b)=>(b.missingCost||0)-(a.missingCost||0));
  document.getElementById('decktable').innerHTML =
    `<thead><tr><th>Deck</th><th class="num">Built</th><th class="num">Missing</th>
       <th class="num">To finish</th><th class="num">Value</th></tr></thead><tbody>` +
    rows.map(d=>{
      const pct = d.total ? Math.round(d.owned/d.total*100) : 0;
      const miss = (d.total||0)-(d.owned||0);
      return `<tr class="deckrow">
        <td><div class="cmd">${d.art?`<img src="${d.art}" alt="">`:''}
          <span><b>${d.name}</b><br><span class="sub">${d.commander||d.format||''}</span></span></div></td>
        <td class="num"><span class="pill ${pct===100?'g':'a'}">${pct}%</span></td>
        <td class="num">${miss||'—'}</td>
        <td class="num">${d.missingCost?money(d.missingCost):'—'}</td>
        <td class="num">${money(d.value)}</td></tr>`;
    }).join('') + '</tbody>';
}

function topCards(){
  // TEN, one per PRINTING. The x2 badge is on the card because a duplicate
  // must be visible as one card you own twice, not two cards.
  document.getElementById('top').innerHTML = D.top.map(c=>`
    <div class="card" title="${c.name} — ${c.set||''} · ${money(c.price)}${c.copies>1?' · '+c.copies+' copies':''}">
      ${c.img?`<img src="${c.img}" alt="${c.name}">`:''}
      ${c.copies>1?`<span class="copies">x${c.copies}</span>`:''}
      <div class="cap"><b>${c.name}</b><span class="sub">${money(c.price)}</span></div>
    </div>`).join('');
}

function recent(){
  // NEWEST FIRST, and honest when nothing notable arrived.
  //
  // I tried sorting by price to avoid a panel full of basic lands. That was
  // dressing up the data: Zach's six most recent cards ARE five basic lands
  // and a $0.15 common, and re-ordering them does not change that. Recency is
  // what "recently added" means, so the panel says so -- and calls out when
  // the batch is all bulk, which is itself the useful signal.
  const rows = D.recent.slice();
  const notable = rows.filter(c => (c.price||0) >= 1).length;
  document.getElementById('recent').innerHTML = rows.map(c=>{
    const when = c.when ? new Date(c.when).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '';
    return `<div class="r"><span class="nm">${c.name}</span>
      <span class="sub num">${money(c.price)} · ${when}</span></div>`;
  }).join('') + (notable ? '' :
    `<div class="sub" style="padding-top:.5rem">All recent adds are bulk — nothing over $1.</div>`);
}

function sets(){
  // SORT AND MEASURE THE SAME THING.
  // The API returns sets ordered by VALUE; I drew the bars from COUNT, so
  // Secret Lair (22 cards, $233) got the shortest bar at the top of the list.
  // A chart whose order and whose length disagree is worse than no chart.
  const rows = D.sets.slice().sort((a,b)=>(b.value||0)-(a.value||0));
  const max = Math.max(...rows.map(s=>s.value||0));
  document.getElementById('sets').innerHTML = rows.map(s=>
    `<div class="r"><span class="nm">${s.name}</span>
      <span class="sub num">${money(s.value)} · ${num(s.count)} cards</span></div>
      <div class="bar"><i style="width:${(s.value||0)/max*100}%;background:var(--accent)"></i></div>`
  ).join('');
}

function note(){
  document.getElementById('note').innerHTML =
    `<b>Real data</b> from bindarr-dev — ${num(D.summary.cards)} cards, ${D.decks.length} decks.
     The original sketch showed "▲ $12.40 this week"; the API says
     <b>change7d.available = false</b>, so this reads
     "no price history yet" instead of inventing a number.`;
}

kpis(); deckTable(); topCards(); recent(); sets(); note();
</script>
</body></html>
